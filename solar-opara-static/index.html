<style>

:root{

*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;font-family:'Inter',Arial,sans-serif;background:var(--bg);color:#262520;font-variant-numeric:tabular-nums lining-nums;line-height:1.45}
button,input,select,textarea{font:inherit}#app{min-height:100vh}

.side{width:232px;background:linear-gradient(180deg,#171715 0%,#1e1e1b 100%);color:white;padding:18px 14px;position:fixed;inset:0 auto 0 0;overflow:auto;border-right:1px solid #2e2d28}

.side button:hover{background:#292925;color:#fff;transform:translateX(2px)}.side button.active{background:linear-gradient(90deg,rgba(201,141,47,.24),rgba(201,141,47,.07));color:#f6d999;box-shadow:inset 3px 0 0 var(--gold)}
.side .nav-icon{width:20px;height:20px;display:grid;place-items:center;font-size:15px;opacity:.95}

.main{margin-left:232px;padding:28px 32px 44px;width:calc(100% - 232px);max-width:1600px;min-width:0;overflow-x:hidden}

h1,h2,h3{font-family:'Playfair Display',serif;margin-top:0;color:#24231f}h1{font-size:31px;line-height:1.08;margin-bottom:6px}h2{font-size:24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.top:after{content:"";display:none}

.metric{position:relative;overflow:hidden;padding:20px;min-height:128px;display:flex;flex-direction:column;justify-content:center}.metric:before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:linear-gradient(var(--gold-2),var(--gold))}.metric span{font-size:12px;color:var(--muted);font-weight:600}.metric b{display:block;font-family:'Inter',Arial,sans-serif;font-size:28px;line-height:1.1;margin-top:8px;color:#22211d;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums lining-nums}.metric small{display:block;margin-top:6px;color:#9a968d;font-size:11px}

.btn:hover{transform:translateY(-1px);filter:brightness(1.04)}.btn.gray{background:#53524e;box-shadow:none}.btn.danger{background:var(--danger);box-shadow:none}.btn.small{padding:7px 10px;font-size:12px}
table{width:100%;max-width:100%;border-collapse:separate;border-spacing:0;background:white;border:1px solid var(--line);border-radius:12px;box-shadow:none;display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
th,td{padding:12px 14px;border-bottom:1px solid #eee9e0;text-align:left;font-size:13px;vertical-align:middle;line-height:1.4}th{background:#fbf8f2;color:#716d64;font-size:10px;text-transform:uppercase;letter-spacing:.75px;font-weight:800;white-space:nowrap;position:sticky;top:0;z-index:1}tbody tr:hover td{background:#fffcf6}tr:last-child td{border-bottom:0}
label{display:block;font-size:12px;font-weight:700;margin-bottom:8px;color:#53504a;min-width:0}input,select,textarea{width:100%;min-width:0;padding:11px 12px;border:1px solid #d9d3c9;border-radius:10px;margin-top:5px;background:#fff;outline:none;transition:.18s;color:#24231f}input:focus,select:focus,textarea:focus{border-color:#cf9a47;box-shadow:0 0 0 3px rgba(207,154,71,.12)}
textarea{min-height:92px;resize:vertical}.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px 18px;align-items:start}.full{grid-column:1/-1;min-width:0}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--warn);font-size:10px;font-weight:800;letter-spacing:.3px}.paid{background:var(--ok);color:#276d3b}
.muted{color:var(--muted);line-height:1.5}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.login-page{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr;background:#171715}
.login-art{position:relative;overflow:hidden;padding:65px;display:flex;flex-direction:column;justify-content:flex-end;background:radial-gradient(circle at 35% 20%,rgba(227,173,75,.38),transparent 23%),linear-gradient(145deg,#201e18,#111)}
.login-art:before{content:"";position:absolute;width:520px;height:520px;border:1px solid rgba(229,176,79,.16);border-radius:50%;top:-170px;left:-140px;box-shadow:0 0 0 55px rgba(229,176,79,.04),0 0 0 110px rgba(229,176,79,.025)}
.login-art h2{position:relative;font-size:48px;color:#f4d592;max-width:500px;margin:0}.login-art p{position:relative;color:#aaa69c;max-width:500px;line-height:1.6}
.login{display:flex;align-items:center;justify-content:center;padding:30px;background:linear-gradient(180deg,#f8f5ef,#eee8de)}.login .card{width:min(440px,100%);padding:30px;border-radius:22px}.login-logo{display:flex;align-items:center;gap:12px;margin-bottom:22px}.login-logo img{width:48px;height:48px}.login-logo strong{font-family:'Playfair Display',serif;font-size:25px}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;background:#f3f0e9;border:1px dashed #d7cdbd;padding:11px;border-radius:10px;font-size:11px}.toast{position:fixed;right:20px;top:20px;background:#24231f;color:#fff;padding:13px 16px;border-radius:11px;z-index:9999;box-shadow:0 18px 40px rgba(0,0,0,.22)}
.warnbox{background:#fff9ec;border:1px solid #ecd8a8;padding:13px 15px;border-radius:11px}
.dashboard-hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:22px}.dashboard-hero p{margin:4px 0 0;color:var(--muted)}
.summary-strip{margin-top:15px;background:#24231f;border-radius:14px;padding:18px 20px;color:#fff;display:flex;justify-content:space-between;gap:20px;align-items:center;box-shadow:none}.summary-strip strong{font-family:'Inter',Arial,sans-serif;font-size:26px;color:#f1ce82;font-weight:700;font-variant-numeric:tabular-nums lining-nums}.summary-strip span{font-size:12px;color:#aaa79f}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:12px;min-width:0}.day{min-height:118px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px;min-width:0;overflow:hidden}.day b{font-size:12px}.evt{font-size:11px;line-height:1.35;background:#f8edda;border-left:3px solid var(--gold);padding:6px 7px;border-radius:6px;margin-top:5px;overflow-wrap:anywhere}
.empty{padding:34px 18px;text-align:center;color:var(--muted);border:1px dashed #d9d1c5;border-radius:12px;background:#fff}.advanced-panel{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fbfaf7}.advanced-panel summary{cursor:pointer;font-weight:700;color:#57534c}.advanced-panel[open] summary{margin-bottom:12px}.advanced-grid{margin-top:8px}.subtle-note{font-size:12px;color:var(--muted);line-height:1.5}.badge.late{background:#fde8e3;color:#953b31}
.money,td,th,input[type="number"],input[type="date"],input[type="datetime-local"]{font-variant-numeric:tabular-nums lining-nums}
td code,.code{max-width:100%;overflow-wrap:anywhere}
td .btn{white-space:nowrap}
table input,table select{min-width:180px}
@media(max-width:1200px){th,td{padding:10px 11px}.main{padding:24px}}
@media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.main{padding:26px}.login-page{grid-template-columns:1fr}.login-art{display:none}}
@media(max-width:850px){.layout{display:block}.side{position:static;width:100%;display:flex;gap:4px;overflow:auto;align-items:center}.brand{min-width:210px;border:0;margin:0;padding:3px 8px}.brand-copy span{display:none}.side button{min-width:max-content}.main{margin:0;width:100%;padding:18px;overflow-x:hidden}.form{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.top{flex-wrap:wrap}.calendar{overflow-x:auto}}
@media(max-width:560px){.grid,.form{grid-template-columns:1fr}.dashboard-hero,.top{align-items:flex-start;flex-direction:column}.calendar{grid-template-columns:1fr 1fr}.main{padding:14px}h1{font-size:28px}h2{font-size:21px}.card{padding:14px}.btn{width:auto;max-width:100%}th,td{font-size:12px}.summary-strip{align-items:flex-start;flex-direction:column}.metric{min-height:105px}}
</style>

<body><div id="app"></div>
<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.95.0";
import QRCode from "https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm";

const SUPABASE_URL="https://bdfojankowlfuezdhdjl.supabase.co";
const SUPABASE_KEY="sb_publishable_mHNwZ6rrplQy9P-0o3wfnQ_iRC_AvYY";
const publicClient=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const googleClient=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
let sessionToken=sessionStorage.getItem("solar_session")||"";
// Elimina tokens persistentes legados do navegador.
localStorage.removeItem("solar_session");
const sessionClient=t=>createClient(SUPABASE_URL,SUPABASE_KEY,{global:{headers:{"x-solar-session":t}},auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
let sb=sessionToken?sessionClient(sessionToken):publicClient;
const PIX="33.958.617/0001-73";
const NFSE_API="https://solar-opara-nfse-api7.onrender.com";
async function nfGateway(path,opt={}){
 let lastError=null;
 for(let i=0;i<3;i++){
   try{
     const ctrl=new AbortController();
     const timer=setTimeout(()=>ctrl.abort(),15000);
     const r=await fetch(NFSE_API+path,{
       ...opt,
       signal:ctrl.signal,
       headers:{"Content-Type":"application/json","X-Solar-Session":sessionToken,...(opt.headers||{})}
     });
     clearTimeout(timer);
     const j=await r.json().catch(()=>({}));
     if(r.ok)return j;
     lastError=new Error(j.error||"Falha na integração fiscal");
     if(r.status<500)break;
   }catch(e){lastError=e;}
   if(i<2)await sleep(700*(i+1));
 }
 throw lastError||new Error("Falha na integração fiscal");
}
let me=null, profile=null, route="dashboard";
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const dateBR=v=>v?new Date(v+"T12:00:00").toLocaleDateString("pt-BR"):"—";
const dtBR=v=>v?new Date(v).toLocaleString("pt-BR"):"—";
const toast=t=>{let x=document.createElement("div");x.className="toast";x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),2500)};
const id=()=>crypto.randomUUID();
const audit=async(action,entity,entity_id,details={})=>{await sb.from("so_audit").insert({action,entity,entity_id:String(entity_id||""),details})};
async function passwordDigest(username,password){
 const enc=new TextEncoder();
 const key=await crypto.subtle.importKey("raw",enc.encode(password),"PBKDF2",false,["deriveBits"]);
 const bits=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:enc.encode("solar-opara:"+username.toLowerCase()),iterations:150000},key,256);
 return Array.from(new Uint8Array(bits),b=>b.toString(16).padStart(2,"0")).join("");
}
const navMeta={
 dashboard:["Início","◫"],clientes:["Clientes","◎"],agenda:["Agenda","▦"],contratos:["Contratos","▤"],receber:["Cobranças","↙"],recebimentos:["Pagamentos","✓"],despesas:["Despesas","↗"],nfse:["Notas fiscais","N"],usuarios:["Equipe","♙"],auditoria:["Histórico","⌁"]
};
function nav(){return Object.entries(navMeta).filter(([x])=>profile?.role==="admin"||!["usuarios","auditoria"].includes(x)).map(([x,m])=>`<button data-route="${x}" class="${route===x?"active":""}"><span class="nav-icon">${m[1]}</span><span>${m[0]}</span></button>`).join("")}
function shell(body){return `<div class="layout"><aside class="side"><div class="brand"><img src="/favicon.svg" alt=""><div class="brand-copy"><strong>Solar Opará</strong><span>Gestão de Eventos</span></div></div>${nav()}<button id="logout" class="logout"><span class="nav-icon">↪</span><span>Sair</span></button></aside><main class="main">${body}</main></div>`}
function bindNav(){document.querySelectorAll("[data-route]").forEach(b=>b.onclick=()=>{route=b.dataset.route;render()});$("#logout").onclick=async()=>{if(sessionToken)await publicClient.rpc("so_local_logout",{p_token:sessionToken});await googleClient.auth.signOut();sessionStorage.removeItem("solar_session");sessionToken="";me=null;profile=null;location.reload()}}
function setApp(h){$("#app").innerHTML=h}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function rpcWithRetry(client,name,args={},tries=3){
 let last={data:null,error:null};
 for(let i=0;i<tries;i++){
   try{ last=await client.rpc(name,args); }catch(e){ last={data:null,error:e}; }
   if(!last.error)return last;
   if(i<tries-1)await sleep(450*(i+1));
 }
 return last;
}
async function finishGoogleLogin(){
 let session=null,sessionError=null;
 for(let i=0;i<3;i++){
   const r=await googleClient.auth.getSession();
   session=r.data?.session||null;sessionError=r.error||null;
   if(session||!sessionError)break;
   await sleep(350*(i+1));
 }
 if(!session)return false;

 const {data,error}=await rpcWithRetry(googleClient,"so_google_login",{},3);
 if(error){
   console.error("Falha temporária no login Google",error);
   return "O serviço de acesso oscilou. Tente novamente em alguns segundos.";
 }
 if(!data?.ok){
   const msg=data?.error==="not_authorized"
     ?"Esta conta Google ainda não foi autorizada pelo administrador."
     :data?.error==="google_required"
       ?"Entre usando uma conta Google."
       :data?.error==="email_not_confirmed"
         ?"Sua conta Google precisa ter e-mail confirmado."
         :"Não foi possível validar sua conta Google.";
   if(["not_authorized","google_required","email_not_confirmed"].includes(data?.error||"")){
     await googleClient.auth.signOut();
   }
   sessionStorage.removeItem("solar_session");
   sessionToken="";
   return msg;
 }
 sessionToken=data.token;
 sessionStorage.setItem("solar_session",sessionToken);
 sb=sessionClient(sessionToken);
 me=data.user;
 profile=data.user;
 history.replaceState({},document.title,location.pathname);
 return true;
}
async function loginView(){
 const googleResult=await finishGoogleLogin();
 if(googleResult===true)return render();
 const denied=typeof googleResult==="string"?`<div class="warnbox" style="margin:14px 0">${esc(googleResult)}</div>`:"";
 setApp(`<div class="login-page"><section class="login-art"><h2>Gestão simples para momentos importantes.</h2><p>Clientes, agenda, contratos, financeiro, Pix, documentos e NFS-e organizados em um único lugar.</p></section><section class="login"><div class="card"><div class="login-logo"><img src="/favicon.svg" alt=""><div><strong>Solar Opará</strong><div class="muted">Gestão de Eventos</div></div></div><h1 style="font-size:28px">Bem-vindo de volta</h1><p class="muted">Entre com uma conta Google autorizada pelo administrador.</p>${denied}<button class="btn" style="width:100%;margin-top:14px" id="googleLoginBtn">G&nbsp;&nbsp;Continuar com Google</button><p class="muted" style="font-size:12px;margin-top:16px">Use sua conta Google autorizada para acessar.</p></div></section></div>`);
 $("#googleLoginBtn").onclick=async()=>{
   const b=$("#googleLoginBtn"); b.disabled=true; b.textContent="Abrindo Google...";
   const {error}=await googleClient.auth.signInWithOAuth({
     provider:"google",
     options:{redirectTo:location.origin,queryParams:{prompt:"select_account"}}
   });
   if(error){b.disabled=false;b.textContent="G  Continuar com Google";toast("Não foi possível abrir o login Google");}
 };
}
async function load(){
 if(!sessionToken)return loginView();
 const {data,error}=await rpcWithRetry(publicClient,"so_local_session",{p_token:sessionToken},3);
 if(error){
   console.error("Falha temporária ao validar sessão",error);
   setApp('<div class="login-page"><section class="login"><div class="card"><h1 style="font-size:28px">Reconectando...</h1><p class="muted">O serviço está demorando para responder. Sua sessão foi preservada.</p><button class="btn" style="width:100%" onclick="location.reload()">Tentar novamente</button></div></section></div>');
   return;
 }
 if(!data?.ok){
   sessionStorage.removeItem("solar_session");
   sessionToken="";
   return loginView();
 }
 me=data.user;profile=data.user;sb=sessionClient(sessionToken);render();
}
async function render(){
 let body=""; try{
 if(route==="dashboard")body=await dashboard();
 if(route==="clientes")body=await clientes();
 if(route==="agenda")body=await agenda();
 if(route==="contratos")body=await contratos();
 if(route==="receber")body=await receber();
 if(route==="recebimentos")body=await recebimentos();
 if(route==="despesas")body=await despesas();
 if(route==="nfse")body=await nfse();
 if(route==="usuarios")body=await usuarios();
 if(route==="auditoria")body=await auditoria();
 setApp(shell(body));bindNav();bindPage();
 }catch(e){console.error(e);setApp(shell(`<div class=card><h2>Não foi possível carregar esta tela</h2><p class="muted">Atualize a página e tente novamente. Se o problema continuar, procure o administrador.</p><button class="btn" onclick="location.reload()">Atualizar</button></div>`));bindNav()}
}
async function dashboard(){
 const [{data:c},{data:r},{data:p},{data:e}]=await Promise.all([sb.from("so_contracts").select("*"),sb.from("so_receivables").select("*"),sb.from("so_payments").select("*").eq("reversed",false),sb.from("so_expenses").select("*")]);
 const total=(r||[]).reduce((a,x)=>a+Number(x.amount),0),paid=(p||[]).reduce((a,x)=>a+Number(x.amount),0),exp=(e||[]).reduce((a,x)=>a+Number(x.amount),0),saldo=paid-exp;
 return `<div class="dashboard-hero"><div><div class="page-kicker">Resumo</div><h1>Visão geral</h1><p>As principais informações do Solar Opará em um só lugar.</p></div><button class=btn data-route="contratos">＋ Novo contrato</button></div><div class=grid>
 <div class="card metric"><span>Contratos</span><b>${(c||[]).length}</b><small>eventos cadastrados</small></div>
 <div class="card metric"><span>Em aberto</span><b>${money(Math.max(0,total-paid))}</b><small>valores a receber</small></div>
 <div class="card metric"><span>Recebido</span><b>${money(paid)}</b><small>pagamentos registrados</small></div>
 <div class="card metric"><span>Despesas</span><b>${money(exp)}</b><small>saídas registradas</small></div></div>
 <div class="summary-strip"><div><span>Saldo registrado</span><br><strong>${money(saldo)}</strong></div><div><span>Pix oficial</span><br><b>33.958.617/0001-73</b></div></div>`;
}
async function clientes(){
 const {data}=await sb.from("so_clients").select("*").order("created_at",{ascending:false});
 return `<div class=top><h1>Clientes</h1><button class=btn id="newClient">+ Novo cliente</button></div><div id="clientForm"></div><table><tr><th>Nome</th><th>CPF/CNPJ</th><th>Telefone</th><th>E-mail</th><th></th></tr>${(data||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.document)}</td><td>${esc(x.phone)}</td><td>${esc(x.email)}</td><td><a class="btn small gray" href="mailto:${encodeURIComponent(x.email||"")}?subject=${encodeURIComponent("Solar Opará")}" target="_blank">E-mail</a></td></tr>`).join("")}</table>`;
}
function clientForm(){return `<div class=card><form id=cf class=form><label>Nome/Razão social<input name=name required></label><label>CPF/CNPJ<input name=document></label><label>Telefone<input name=phone></label><label>E-mail<input type=email name=email></label><label class=full>Endereço<input name=address></label><label class=full>Observações<textarea name=notes></textarea></label><div class=full><button class=btn>Salvar</button></div></form></div>`}
async function ensureAgendaXLSX(){
 if(window.XLSX)return window.XLSX;
 await new Promise((ok,no)=>{const x=document.createElement("script");x.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";x.onload=ok;x.onerror=()=>no(new Error("Não foi possível carregar o leitor de Excel"));document.head.appendChild(x)});
 return window.XLSX;
}
function agendaNorm(v){return String(v??"").trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function agendaDate(v,X){
 if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);
 if(typeof v==="number"){const p=X.SSF.parse_date_code(v);if(p)return p.y+"-"+String(p.m).padStart(2,"0")+"-"+String(p.d).padStart(2,"0")}
 const q=String(v??"").trim();let m=q.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);if(m)return m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0");
 m=q.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})/);if(m)return m[1]+"-"+m[2].padStart(2,"0")+"-"+m[3].padStart(2,"0");
 return null;
}
async function parseAgendaImport(file){
 const ext=(file.name.split(".").pop()||"").toLowerCase();
 if(!["xlsx","xls","csv"].includes(ext))throw new Error("Formato inválido. Use .xlsx, .xls ou .csv");
 if(file.size>10*1024*1024)throw new Error("Arquivo muito grande. Limite: 10 MB");
 const X=await ensureAgendaXLSX(),book=X.read(await file.arrayBuffer(),{type:"array",cellDates:true});
 let events=[],notes=[];
 for(const sheet of book.SheetNames){
  if(agendaNorm(sheet).includes("instruc"))continue;
  const rows=X.utils.sheet_to_json(book.Sheets[sheet],{header:1,raw:true,defval:""});
  let dc=-1,cc=-1,nc=-1,start=0;
  for(let r=0;r<Math.min(rows.length,50);r++){
   for(let c=0;c<(rows[r]||[]).length;c++){
    const n=agendaNorm(rows[r][c]);
    if(n==="data")dc=c;
    if(["compromisso","evento","descricao"].includes(n))cc=c;
    if(["anotacao","anotacoes","observacao","observacoes"].includes(n))nc=c;
   }
   if(dc>=0&&cc>=0){start=r+1;break}
  }
  if(dc>=0&&cc>=0)for(let r=start;r<rows.length;r++){
   const d=agendaDate(rows[r]?.[dc],X),desc=String(rows[r]?.[cc]??"").replace(/\s+/g," ").trim();
   if(d&&desc)events.push({event_date:d,description:desc,source_sheet:String(sheet).trim()});
  }
  if(nc>=0)for(let r=start;r<rows.length;r++){
   const note=String(rows[r]?.[nc]??"").replace(/\s+/g," ").trim();
   if(note)notes.push({note_text:note,source_sheet:String(sheet).trim()});
  }
 }
 events=[...new Map(events.map(x=>[x.event_date+"|"+x.description+"|"+x.source_sheet,x])).values()];
 notes=[...new Map(notes.map(x=>[x.note_text+"|"+x.source_sheet,x])).values()];
 return {events,notes,ext,sheets:book.SheetNames};
}
async function previewAgendaImport(file){
 const parsed=await parseAgendaImport(file);
 const [{data:oldE},{data:oldN}]=await Promise.all([
  sb.from("so_legacy_events").select("event_date,description,source_sheet"),
  sb.from("so_legacy_notes").select("note_text,source_sheet")
 ]);
 const es=new Set((oldE||[]).map(x=>String(x.event_date).slice(0,10)+"|"+x.description+"|"+x.source_sheet));
 const ns=new Set((oldN||[]).map(x=>x.note_text+"|"+x.source_sheet));
 parsed.freshEvents=parsed.events.filter(x=>!es.has(x.event_date+"|"+x.description+"|"+x.source_sheet));
 parsed.freshNotes=parsed.notes.filter(x=>!ns.has(x.note_text+"|"+x.source_sheet));
 return parsed;
}
async function commitAgendaImport(file,p){
 let importedEvents=[],importedNotes=[];
 if(p.freshEvents.length){const q=await sb.from("so_legacy_events").upsert(p.freshEvents,{onConflict:"event_date,description,source_sheet",ignoreDuplicates:true}).select();if(q.error)throw q.error;importedEvents=q.data||[]}
 if(p.freshNotes.length){const q=await sb.from("so_legacy_notes").upsert(p.freshNotes,{onConflict:"note_text,source_sheet",ignoreDuplicates:true}).select();if(q.error)throw q.error;importedNotes=q.data||[]}
 const q=await sb.from("so_import_batches").insert({
  filename:file.name,file_type:p.ext,events_found:p.events.length,events_imported:importedEvents.length,
  duplicates_skipped:p.events.length-p.freshEvents.length,notes_found:p.notes.length,notes_imported:importedNotes.length
 });
 if(q.error)throw q.error;
 await audit("import","agenda",file.name,{events:importedEvents.length,notes:importedNotes.length});
 return {events:importedEvents.length,notes:importedNotes.length};
}
async function ensureAgendaPDF(){

 await new Promise((ok,no)=>{
  const x=document.createElement("script");
  x.src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js";
  x.onload=ok;
  x.onerror=()=>no(new Error("Não foi possível carregar o gerador de PDF."));
  document.head.appendChild(x);

async function exportAgendaPDF(from,to){
 if(!/^\d{4}-\d{2}-\d{2}$/.test(from)||!/^\d{4}-\d{2}-\d{2}$/.test(to))throw new Error("Informe as duas datas.");
 if(from>to)throw new Error("A data inicial não pode ser maior que a data final.");
 const events=(window.__solarAgendaEvents||[]).filter(x=>x.event_date>=from&&x.event_date<=to);
 if(!events.length)throw new Error("Não há eventos no período selecionado.");
 const JsPDF=await ensureAgendaPDF(),doc=new JsPDF({unit:"mm",format:"a4",orientation:"portrait"});
 const W=210,H=297,M=16,contentW=W-M*2;
 let y=18,page=1;
 const total=events.length,system=events.filter(x=>x.origin==="system").length,legacy=total-system;
 const generated=new Date().toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo"});
 const range=`${dateBR(from)} a ${dateBR(to)}`;
 const addHeader=()=>{
  doc.setFont("helvetica","bold");doc.setFontSize(16);doc.text("SOLAR OPARÁ — AGENDA DA DIRETORIA",M,y);
  y+=7;doc.setFont("helvetica","normal");doc.setFontSize(9);doc.text(`Período: ${range}   |   Página ${page}`,M,y);
  y+=5;doc.setDrawColor(190);doc.line(M,y,W-M,y);y+=7;
 };
 const newPage=()=>{doc.addPage();page++;y=18;addHeader()};
 const need=h=>{if(y+h>H-17)newPage()};
 const block=(title,value,x,w)=>{
  doc.setFillColor(247,244,238);doc.roundedRect(x,y,w,17,2,2,"F");
  doc.setFont("helvetica","normal");doc.setFontSize(7.5);doc.text(title.toUpperCase(),x+3,y+5);
  doc.setFont("helvetica","bold");doc.setFontSize(13);doc.text(String(value),x+3,y+12);
 };
 addHeader();
 doc.setFont("helvetica","normal");doc.setFontSize(9);doc.text(`Gerado em ${generated}`,M,y);y+=7;
 const gap=3,bw=(contentW-gap*2)/3;
 block("Total de compromissos",total,M,bw);block("Eventos do sistema",system,M+bw+gap,bw);block("Itens importados",legacy,M+(bw+gap)*2,bw);y+=23;
 doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text("Agenda cronológica",M,y);y+=6;
 let lastDate="";
 for(const e of events){
  if(e.event_date!==lastDate){
   need(13);
   doc.setFillColor(232,226,216);doc.rect(M,y-4,contentW,8,"F");
   doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.text(dateBR(e.event_date),M+3,y+1);
   y+=8;lastDate=e.event_date;
  }
  const origin=e.origin==="legacy"?"IMPORTADO":"SISTEMA";
  const subtitle=e.subtitle||"";
  const status=e.origin==="legacy"?"Importado":String(e.status||"").replace(/^./,c=>c.toUpperCase());
  doc.setFont("helvetica","bold");doc.setFontSize(9.5);
  const titleLines=doc.splitTextToSize(String(e.label||"Sem título"),contentW-6);
  doc.setFont("helvetica","normal");doc.setFontSize(8);
  const subText=[subtitle&&(`Cliente / referência: ${subtitle}`),`Origem: ${origin}   |   Status: ${status}`].filter(Boolean).join("\n");
  const subLines=doc.splitTextToSize(subText,contentW-6);
  const h=5+titleLines.length*4.2+subLines.length*3.8;
  need(h+3);
  doc.setDrawColor(224);doc.roundedRect(M,y-2,contentW,h,1.5,1.5,"S");
  doc.setFont("helvetica","bold");doc.setFontSize(9.5);doc.text(titleLines,M+3,y+3);y+=titleLines.length*4.2+3;
  doc.setFont("helvetica","normal");doc.setFontSize(8);doc.text(subLines,M+3,y+1);y+=subLines.length*3.8+5;
 }
 need(18);y+=2;doc.setDrawColor(190);doc.line(M,y,W-M,y);y+=6;
 doc.setFont("helvetica","normal");doc.setFontSize(8);
 const notes=doc.splitTextToSize("Relatório gerencial gerado pelo Solar Opará. Inclui eventos cadastrados no sistema e compromissos importados da planilha dentro do período selecionado.",contentW);
 doc.text(notes,M,y);
 const safeFrom=from.replaceAll("-",""),safeTo=to.replaceAll("-","");
 doc.save(`solar-opara-agenda-${safeFrom}-a-${safeTo}.pdf`);
 await audit("export","agenda_pdf",from+"_"+to,{from,to,total,system,imported:legacy});
}

function planRecebimentos(total, firstDate, count){
 const cents=Math.round(Number(total)*100);
 if(!Number.isFinite(cents)||cents<0)throw Error("Valor do contrato inválido.");
 if(!Number.isInteger(count)||count<1||count>12)throw Error("Escolha de 1 a 12 parcelas.");
 if(cents>0&&cents<count)throw Error("Valor insuficiente para o número de parcelas.");
 if(!/^\d{4}-\d{2}-\d{2}$/.test(firstDate))throw Error("Informe a data do primeiro vencimento.");
 const [year,month,day]=firstDate.split("-").map(Number);
 const first=new Date(Date.UTC(year,month-1,day));
 if(first.toISOString().slice(0,10)!==firstDate)throw Error("Vencimento inválido.");
 const base=Math.floor(cents/count),extra=cents%count;
 return Array.from({length:count},(_,i)=>{
  const start=new Date(Date.UTC(year,month-1+i,1));
  const last=new Date(Date.UTC(start.getUTCFullYear(),start.getUTCMonth()+1,0)).getUTCDate();
  const date=new Date(Date.UTC(start.getUTCFullYear(),start.getUTCMonth(),Math.min(day,last)));
  return {amount:(base+(i<extra?1:0))/100,due_date:date.toISOString().slice(0,10)};
 });
}

 return {contract_id:contractId,description:"Contrato - "+eventName+(totalParts>1?" | Parcela "+(position+1)+"/"+totalParts:""),amount:part.amount,due_date:part.due_date,txid:tx};
}
function bindPaymentPlan(form){
 if(!form)return;
 const method=form.elements.namedItem("payment_terms"),parts=form.elements.namedItem("installment_count");
 if(!method||!parts)return;
 const sync=()=>{
  const allow=method.value==="Pix parcelado"||method.value==="Boleto bancário";
  parts.disabled=!allow;
  if(!allow)parts.value="1";
  if(method.value==="Pix parcelado"&&Number(parts.value)<2)parts.value="2";
 };
 method.addEventListener("change",sync);sync();
}

async function saveContractForm(form){
 const f=new FormData(form),contractId=String(f.get("contract_id")||""),o=Object.fromEntries(f);
 const requested=Number(f.get("installment_count")||1);
 delete o.contract_id;delete o.due_date;delete o.installment_count;
 ["capacity"].forEach(k=>o[k]=o[k]?Number(o[k]):null);
 ["rental_value","cleaning_fee","additional_value"].forEach(k=>o[k]=Number(o[k]||0));
 const dueDate=String(f.get("due_date")||o.event_date);
 const total=Number(o.rental_value)+Number(o.cleaning_fee)+Number(o.additional_value);
 const method=String(o.payment_terms||"PIX");
 const count=method==="Pix parcelado"||method==="Boleto bancário"?requested:1;
 if(method==="Pix parcelado"&&count<2)return toast("Pix parcelado exige 2 a 12 parcelas.");
 let plan;
 try{plan=planRecebimentos(total,dueDate,count)}catch(e){return toast(e.message)}
 let conflictQ=sb.from("so_contracts").select("id").eq("event_date",o.event_date).eq("status","active");
 if(contractId)conflictQ=conflictQ.neq("id",contractId);
 const {data:conflict,error:conflictError}=await conflictQ;
 if(conflictError)return toast(conflictError.message);
 if(conflict?.length&&!confirm("Já existe outro evento ativo nesta data. Deseja continuar?"))return;
 form.querySelector("button[type=submit],button:not([type])")?.setAttribute("disabled","disabled");
 try{
  if(contractId){
   const [{data:current,error:currentError},{data:oldCharges,error:chargeError}]=await Promise.all([
    sb.from("so_contracts").select("*").eq("id",contractId).single(),
    sb.from("so_receivables").select("id,amount,due_date").eq("contract_id",contractId).order("created_at",{ascending:true})
   ]);
   if(currentError||chargeError)throw Error(currentError?.message||chargeError?.message);
   const ids=(oldCharges||[]).map(x=>x.id);
   const {data:received,error:paidError}=ids.length?
    await sb.from("so_payments").select("id").in("receivable_id",ids).eq("reversed",false):
    {data:[],error:null};
   if(paidError)throw Error(paidError.message);
   const oldTotal=Math.round((Number(current.rental_value||0)+Number(current.cleaning_fee||0)+Number(current.additional_value||0))*100);
   const newTotal=Math.round(total*100);
   if(received?.length&&(newTotal!==oldTotal||count!==ids.length||method!==(current.payment_terms||"PIX")||dueDate!==(oldCharges?.[0]?.due_date||current.event_date)))
    throw Error("Já existem pagamentos. Não altere valor, parcelas, vencimento inicial ou forma de pagamento; regularize os recebimentos primeiro.");
   if(!received?.length){
    const extras=(oldCharges||[]).slice(plan.length).map(x=>x.id);
    if(extras.length){
     const {error}=await sb.from("so_receivables").delete().in("id",extras);
     if(error)throw Error("Não foi possível remover parcelas antigas: "+error.message);
    }
    for(let i=0;i<Math.min(oldCharges?.length||0,plan.length);i++){
     const part=plan[i];
     const description="Contrato - "+o.event_name+(plan.length>1?" | Parcela "+(i+1)+"/"+plan.length:"");
     const {error}=await sb.from("so_receivables").update({description,amount:part.amount,due_date:part.due_date}).eq("id",oldCharges[i].id);
     if(error)throw Error("Falha ao atualizar parcela "+(i+1)+": "+error.message);
    }
    if(plan.length>(oldCharges?.length||0)){
     const start=oldCharges?.length||0;
     const inserts=plan.slice(start).map((part,i)=>newCharge(contractId,o.event_name,part,start+i,plan.length));
     const {error}=await sb.from("so_receivables").insert(inserts);
     if(error)throw Error("Falha ao criar parcelas: "+error.message);
    }
   }
   const {error}=await sb.from("so_contracts").update(o).eq("id",contractId);
   if(error)throw Error(error.message);
   const {error:nfErr}=await sb.from("so_nfse").update({amount:total}).eq("contract_id",contractId).eq("status","draft");
   if(nfErr)console.warn("NFS-e draft update:",nfErr.message);
   await audit("update","contract",contractId,{event:o.event_name,total,method,installments:count});
   toast("Contrato atualizado e cobranças revisadas.");
  }else{
   const {data:c,error}=await sb.from("so_contracts").insert({...o,status:"active"}).select().single();
   if(error)throw Error(error.message);
   const {error:chargeError}=await sb.from("so_receivables").insert(plan.map((part,i)=>newCharge(c.id,o.event_name,part,i,plan.length)));
   if(chargeError)throw Error("Contrato criado, mas as parcelas não foram geradas: "+chargeError.message);
   const {error:nfErr}=await sb.from("so_nfse").insert({contract_id:c.id,status:"draft",amount:total});
   if(nfErr)console.warn("NFS-e draft creation:",nfErr.message);
   await audit("create","contract",c.id,{event:o.event_name,total,method,installments:count});
   toast("Contrato criado com "+count+" cobrança(s).");
  }
  render();
 }catch(e){
  toast(e?.message||String(e));
  form.querySelector("button[type=submit],button:not([type])")?.removeAttribute("disabled");
 }
}

function emv(i,v){return i+String(v.length).padStart(2,"0")+v}function crc(s){let c=65535;for(const h of s){c^=h.charCodeAt(0)<<8;for(let i=0;i<8;i++)c=(c&32768)?((c<<1)^4129)&65535:(c<<1)&65535}return c.toString(16).toUpperCase().padStart(4,"0")}
function pixPayload(amount,tx){const ma=emv("00","br.gov.bcb.pix")+emv("01",PIX);let p=emv("00","01")+emv("26",ma)+emv("52","0000")+emv("53","986")+emv("54",Number(amount).toFixed(2))+emv("58","BR")+emv("59","SOLAR OPARA")+emv("60","PIRAPORA")+emv("62",emv("05",tx.slice(0,25)))+"6304";return p+crc(p)}
async function openPix(rid){
 const [{data:r,error:recErr},{data:p,error:payErr}]=await Promise.all([
  sb.from("so_receivables").select("*,so_contracts(event_name,payment_terms,so_clients(name,email))").eq("id",rid).single(),
  sb.from("so_payments").select("*").eq("receivable_id",rid).eq("reversed",false)
 ]);
 if(recErr||payErr||!r)return toast(recErr?.message||payErr?.message||"Cobrança não encontrada.");
 const paid=(p||[]).reduce((a,x)=>a+Number(x.amount),0),balance=Math.max(0,Number(r.amount)-paid);
 const terms=String(r.so_contracts?.payment_terms||"PIX");
 const pix=terms==="PIX"||terms==="Pix parcelado";
 const boleto=terms==="Boleto bancário"||terms==="Boleto";
 const defaultMethod=boleto?"Boleto bancário":pix?"PIX":terms;
 const choices=["PIX","Boleto bancário","Transferência bancária","Dinheiro","Cartão"];
 if(!choices.includes(defaultMethod))choices.push(defaultMethod);
 const options=choices.map(x=>'<option value="'+esc(x)+'"'+(x===defaultMethod?' selected':'')+'>'+esc(x)+'</option>').join("");
 let details="";
 if(pix&&balance>0){
  const payload=pixPayload(balance,r.txid);
  const qr=await QRCode.toDataURL(payload);
  details='<p><b>Pix da parcela:</b> '+money(balance)+'</p><img src="'+qr+'" alt="QR Code Pix" style="max-width:280px;width:100%"><div class="code">'+esc(payload)+'</div>';
 }else if(boleto){
  details='<div class="warnbox">Boleto bancário: vencimento e recebimento registrados no sistema. Para emitir boleto com linha digitável ou código de barras é necessária integração com o banco emissor. Registre pagamento somente após confirmação bancária.</div>';
 }else{
  details='<p class="muted">Selecione a forma realmente recebida e confirme após verificar o pagamento.</p>';
 }
 const fields=balance>0?
  '<form id="pf" class="form"><label>Valor recebido<input type="number" step="0.01" min="0.01" max="'+balance.toFixed(2)+'" name="amount" value="'+balance.toFixed(2)+'" required></label>'+
  '<label>Forma recebida<select name="method">'+options+'</select></label>'+
  '<label>Data/hora<input type="datetime-local" name="paid_at" value="'+new Date().toISOString().slice(0,16)+'"></label>'+
  '<label>Referência/comprovante<input name="reference" placeholder="Código da transação ou confirmação bancária"></label>'+
  '<label class="full">Observação<textarea name="notes"></textarea></label>'+
  '<div class="full"><button class="btn" type="submit">Confirmar recebimento</button></div></form>':
  '<p><b>Esta cobrança está totalmente paga.</b></p>';
 $("#pixModal").innerHTML='<div class="card"><h2>Cobrança / confirmar pagamento</h2>'+
  '<p><b>Cliente:</b> '+esc(r.so_contracts?.so_clients?.name)+'</p>'+
  '<p><b>Evento:</b> '+esc(r.so_contracts?.event_name)+'</p>'+
  '<p><b>Forma contratada:</b> '+esc(terms)+'</p>'+
  '<p><b>Vencimento:</b> '+dateBR(r.due_date)+'</p>'+
  '<p><b>Parcela:</b> '+money(r.amount)+' · <b>Saldo:</b> '+money(balance)+'</p>'+
  details+fields+'</div>';
 if(!$("#pf"))return;
 $("#pf").onsubmit=async e=>{
  e.preventDefault();
  const f=new FormData(e.target),amount=Number(f.get("amount")),method=String(f.get("method")||""),ref=String(f.get("reference")||"").trim();
  if(!Number.isFinite(amount)||amount<=0||amount>balance+0.001)return toast("Informe um valor até o saldo da cobrança.");
  if(method==="Boleto bancário"&&!ref)return toast("Informe a referência da confirmação bancária do boleto.");
  const submit=e.target.querySelector('button[type="submit"]');
  if(submit)submit.disabled=true;
  try{
   const at=String(f.get("paid_at")||"");
   const paidAt=at?new Date(at).toISOString():new Date().toISOString();
   const {error:insertErr}=await sb.from("so_payments").insert({receivable_id:rid,amount,method,reference:ref||null,notes:String(f.get("notes")||""),paid_at:paidAt});
   if(insertErr)throw Error(insertErr.message);
   const {data:all,error:listErr}=await sb.from("so_payments").select("amount").eq("receivable_id",rid).eq("reversed",false);
   if(listErr)throw Error(listErr.message);
   const sum=(all||[]).reduce((a,x)=>a+Number(x.amount),0);
   const status=sum>=Number(r.amount)-0.001?"paid":sum>0?"partial":"pending";
   const {error:updateErr}=await sb.from("so_receivables").update({status}).eq("id",rid);
   if(updateErr)throw Error("Recebimento salvo, mas o status precisa ser atualizado: "+updateErr.message);
   await audit("confirm_payment","payment",rid,{amount,method});
   toast("Pagamento confirmado e registrado como "+method+".");
   render();
  }catch(err){toast(err.message||String(err));if(submit)submit.disabled=false}
 };
}

 if($("#newExpense"))$("#newExpense").onclick=()=>{$("#expenseForm").innerHTML=expenseForm();$("#ef").onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.amount=Number(o.amount);let {data,error}=await sb.from("so_expenses").insert(o).select().single();if(error)return toast(error.message);await audit("create","expense",data.id,{amount:data.amount});toast("Despesa salva");render()}};
 document.querySelectorAll("[data-nf-edit]").forEach(b=>b.onclick=()=>{
  const n=(window.__solarNfse||[]).find(x=>String(x.id)===String(b.dataset.nfEdit));if(!n)return toast("NFS-e não encontrada");
  $("#nfForm").innerHTML=nfDraftForm(n);$("#nfForm").scrollIntoView({behavior:"smooth",block:"start"});
  $("#nfCancel").onclick=()=>$("#nfForm").innerHTML="";
  $("#nfDraftForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),id=f.get("id"),intent=e.submitter?.value||"draft",n=(window.__solarNfse||[]).find(x=>String(x.id)===String(id)),cl=n?.so_contracts?.so_clients||{};
   const o={competence_date:f.get("competence_date"),amount:Number(f.get("amount")||0),service_description:String(f.get("service_description")||"").trim(),service_code:String(f.get("service_code")||"").trim(),notes:String(f.get("notes")||"").trim(),updated_at:new Date().toISOString()};
   if(intent==="ready"){const missing=[];if(!cl.document)missing.push("CPF/CNPJ do tomador");if(!o.competence_date)missing.push("competência");if(!(o.amount>0))missing.push("valor");if(!o.service_description)missing.push("descrição do serviço");if(!o.service_code)missing.push("código do serviço");if(missing.length)return toast("Falta: "+missing.join(", "));o.status="ready"}else o.status="draft";
   const {error}=await sb.from("so_nfse").update(o).eq("id",id);if(error)return toast(error.message);await audit("update","nfse",id,{status:o.status});toast(o.status==="ready"?"NFS-e pronta para emissão":"Rascunho salvo");render()
  };
 });
 document.querySelectorAll("[data-nf-issue]").forEach(b=>b.onclick=()=>{
  const n=(window.__solarNfse||[]).find(x=>String(x.id)===String(b.dataset.nfIssue));if(!n)return toast("NFS-e não encontrada");
  $("#nfForm").innerHTML=nfIssueForm(n);$("#nfForm").scrollIntoView({behavior:"smooth",block:"start"});$("#nfCancel").onclick=()=>$("#nfForm").innerHTML="";
  $("#nfIssueForm").onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),id=f.get("id"),key=String(f.get("access_key")||"").replace(/\D/g,""),num=String(f.get("nfse_number")||"").trim();
   if(key&&key.length!==44)return toast("A chave de acesso nacional deve ter 44 dígitos");
   const o={status:"issued",nfse_number:num,access_key:key||null,number_key:key||num,issue_date:f.get("issue_date"),amount:Number(f.get("amount")||0),file_url:String(f.get("file_url")||"").trim()||null,notes:String(f.get("notes")||"").trim(),environment:"manual",last_error:null,updated_at:new Date().toISOString()};
   const {error}=await sb.from("so_nfse").update(o).eq("id",id);if(error)return toast(error.message);await audit("issue","nfse",id,{nfse_number:num,has_access_key:!!key,amount:o.amount});toast("NFS-e registrada como emitida");render()
  };
 });
 document.querySelectorAll("[data-nf-copy]").forEach(b=>b.onclick=async()=>{
  const n=(window.__solarNfse||[]).find(x=>String(x.id)===String(b.dataset.nfCopy));if(!n)return;
  const c=n.so_contracts||{},cl=c.so_clients||{},amount=n.amount??nfContractTotal(c),txt=["SOLAR OPARÁ — DADOS PARA NFS-e","Evento: "+(c.event_name||""),"Tomador: "+(cl.name||""),"CPF/CNPJ: "+(cl.document||""),"E-mail: "+(cl.email||""),"Competência: "+(n.competence_date||c.event_date||""),"Valor: "+money(amount),"Descrição: "+(n.service_description||""),"Código do serviço: "+(n.service_code||"")].join("\n");
  try{await navigator.clipboard.writeText(txt);toast("Dados da NFS-e copiados")}catch{toast("Não foi possível copiar")}
 });
 if($("#csvPay"))$("#csvPay").onclick=async()=>{const {data}=await sb.from("so_payments").select("*").eq("reversed",false);let csv="data,valor,metodo,referencia\n"+(data||[]).map(x=>[x.paid_at,x.amount,x.method,x.reference].map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(",")).join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="recebimentos.csv";a.click()}
}
load();
</script><script src="/documents-fiel-core.js"></script><script src="/documents-fiel-render.js"></script><script src="/documents-fiel-words.js"></script><script src="/nfse-auto.js" defer></script></body></html>
